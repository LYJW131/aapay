services:
  backend:
    build: .
    container_name: aapay-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app:ro
      - ./data:/data
    environment:
      - TZ=${TZ}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_ISOLATION=${SESSION_ISOLATION:-true}

  frontend:
    image: nginx
    container_name: aapay-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.aapay.loadbalancer.server.port=80"
      - "traefik.http.routers.aapay.rule=Host(`${AAPAY_DOMAIN}`)"
      - "traefik.http.routers.aapay.entrypoints=websecure"
      - "traefik.http.routers.aapay.tls=true"
      - "traefik.http.routers.aapay.priority=10"
      - "traefik.http.routers.aapay-admin.rule=Host(`${AAPAY_DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.aapay-admin.entrypoints=websecure"
      - "traefik.http.routers.aapay-admin.tls=true"
      - "traefik.http.routers.aapay-admin.priority=100"
      - "traefik.http.routers.aapay-admin.middlewares=authentik@file"

networks:
  proxy:
    external: true

