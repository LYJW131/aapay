name: Demo

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 仓库变量 DEMO_URL（如 https://aapay.example.com）由部署者设置，没设置时跳过；DEMO_BRANCH 指定从哪个分支发布，默认 main
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:demo
      - name: Install Chromium and CJK / emoji fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk fonts-noto-color-emoji
          npx playwright install --with-deps chromium
      - name: Screenshots
        env:
          AAPAY_TARGET: demo
        run: |
          npx vite preview --outDir dist/demo --host 127.0.0.1 --port 5176 --strictPort &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:5176/ >/dev/null && break; sleep 1; done
          npm run screenshots -- http://127.0.0.1:5176 dist/demo/shots
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  deploy:
    needs: build
    if: github.ref_name == (vars.DEMO_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: demo-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
