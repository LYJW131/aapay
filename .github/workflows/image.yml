name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # 可选：同时推到阿里云 ACR。仓库变量 ALIYUN_ACR_IMAGE 填完整镜像名，密钥 ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD 填登录凭证
      ACR_IMAGE: ${{ vars.ALIYUN_ACR_IMAGE }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: images
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$ACR_IMAGE" ]; then echo "$ACR_IMAGE"; fi
            echo EOF
            echo "acr_registry=${ACR_IMAGE%%/*}"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && env.ACR_IMAGE != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.images.outputs.acr_registry }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 个人版拒绝 provenance 的 application/vnd.oci.empty.v1+json
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
